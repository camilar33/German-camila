<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F8F2F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1C1519" media="(prefers-color-scheme: dark)">
<title>Deutschheft</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Deutschheft">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..600,0..100;1,9..144,300..600,0..100&family=Jost:wght@300..600&display=swap">
<style>
/* Layout: one narrow left-aligned column on dotted notebook paper (Leuchtturm-style), soft pill tab bar at the bottom.
   Material: a fine German stationery notebook in Altrosa (dusty rose) and aubergine ink. Serif for headings and German words. */
:root{
  --paper:#F8F2F1;      /* porcelain blush */
  --paper-2:#F0E5E5;    /* inset fill */
  --sheet:#FFFCFB;      /* raised paper */
  --ink:#2F2330;        /* aubergine ink */
  --ink-2:#5F4F5C;
  --ink-3:#9B8A95;
  --rule:rgba(47,35,48,.14);
  --rule-2:rgba(47,35,48,.07);
  --dot:rgba(140,90,110,.20);
  --rose:#E2B4BF;       /* Altrosa, soft fill */
  --rose-deep:#A64F6A;  /* Altrosa, deep: buttons and accents */
  --on-deep:#FFFFFF;
  --on-rose:#2F2330;
  --shadow:0 1px 2px rgba(47,35,48,.05), 0 8px 24px -12px rgba(120,60,85,.22);
  --board:#3B2939;
  --board-cell:#4B3548;
  --board-ink:#FBF0F2;
  --board-mute:#C9AEBD;
  --der:#4D6D9A; --die:#B04B68; --das:#5A876A;
  --ok:#5A876A; --bad:#B04B68;
  --f-ui:"Jost", "Futura", "Avenir Next", "Helvetica Neue", system-ui, sans-serif;
  --f-display:"Fraunces", "Didot", Georgia, serif;
  --f-de:"Fraunces", Georgia, "Times New Roman", serif;
  --gut:18px;
  --r:16px; --r-sm:12px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1C1519; --paper-2:#271E24; --sheet:#251C22;
    --ink:#F4E9EC; --ink-2:#CFBDC6; --ink-3:#907F8A;
    --rule:rgba(244,233,236,.15); --rule-2:rgba(244,233,236,.07); --dot:rgba(240,190,210,.11);
    --rose:#7E4D5E; --rose-deep:#E7A3B6; --on-deep:#1C1519; --on-rose:#F4E9EC;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 26px -14px rgba(0,0,0,.6);
    --board:#2C2029; --board-cell:#3A2B37; --board-ink:#FBF0F2; --board-mute:#B39AA8;
    --der:#9DB7E0; --die:#EE9DB2; --das:#9CCAA9; --ok:#9CCAA9; --bad:#EE9DB2;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#1C1519; --paper-2:#271E24; --sheet:#251C22;
  --ink:#F4E9EC; --ink-2:#CFBDC6; --ink-3:#907F8A;
  --rule:rgba(244,233,236,.15); --rule-2:rgba(244,233,236,.07); --dot:rgba(240,190,210,.11);
  --rose:#7E4D5E; --rose-deep:#E7A3B6; --on-deep:#1C1519; --on-rose:#F4E9EC;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 26px -14px rgba(0,0,0,.6);
  --board:#2C2029; --board-cell:#3A2B37; --board-ink:#FBF0F2; --board-mute:#B39AA8;
  --der:#9DB7E0; --die:#EE9DB2; --das:#9CCAA9; --ok:#9CCAA9; --bad:#EE9DB2;
  color-scheme:dark;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; font-family:var(--f-ui); font-size:16px; line-height:1.5; color:var(--ink); font-weight:400;
  background-color:var(--paper);
  background-image:radial-gradient(circle at 1px 1px, var(--dot) 1px, transparent 1.3px);
  background-size:18px 18px; background-position:9px 9px; background-attachment:fixed;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:left}
:focus-visible{outline:2px solid var(--rose-deep);outline-offset:2px;border-radius:6px}
.num,.tab{font-variant-numeric:tabular-nums lining-nums;font-feature-settings:"tnum" 1,"lnum" 1}
.wrap{max-width:560px;margin:0 auto;padding-inline:var(--gut);padding-block:26px calc(112px + env(safe-area-inset-bottom,0px))}

/* ---------- storage warning ---------- */
.warn{margin:0 0 16px;padding:12px 14px;border:1px solid var(--bad);border-radius:var(--r-sm);background:var(--sheet);font-size:14px;display:flex;gap:10px}
.warn b{color:var(--bad);font-weight:600}

/* ---------- headers ---------- */
.head{display:flex;flex-direction:column;gap:6px;margin-bottom:24px}
.eyebrow{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);font-weight:500}
h1{font-family:var(--f-display);font-variation-settings:"SOFT" 100,"opsz" 96;font-size:42px;line-height:1.02;letter-spacing:-.015em;font-weight:350;margin:0;text-wrap:balance}
h2{font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;font-weight:500;margin:0;color:var(--ink-2)}
.sec{margin-top:36px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-bottom:10px;border-bottom:1px solid var(--rule);margin-bottom:4px}
.sec-h .aside{font-size:13px;color:var(--ink-3);font-family:var(--f-display);font-style:italic;font-variation-settings:"SOFT" 100}
.muted{color:var(--ink-3)}
.small{font-size:13px}
.tag{display:inline-block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:500;color:var(--ink-3);border:1px solid var(--rule);padding:1px 7px;border-radius:20px;vertical-align:3px;font-family:var(--f-ui);font-style:normal}
.tag.now{background:var(--rose-deep);color:var(--on-deep);border-color:var(--rose-deep)}

/* monogram badge for decks */
.code{flex:none;display:inline-grid;place-items:center;width:42px;min-width:42px;height:42px;padding:0;background:var(--paper-2);color:var(--rose-deep);font-family:var(--f-display);font-style:italic;font-weight:500;font-size:12.5px;letter-spacing:0;border-radius:50%;border:1px solid var(--rule)}

/* ---------- segmented control ---------- */
.seg{display:flex;padding:4px;background:var(--paper-2);border-radius:999px;margin-bottom:18px;gap:4px}
.seg button{flex:1;padding:9px 10px;font-size:14px;font-weight:500;text-align:center;color:var(--ink-2);border-radius:999px;transition:background .2s,color .2s}
.seg button[aria-pressed="true"]{background:var(--sheet);color:var(--ink);box-shadow:var(--shadow)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:11px 20px;border:1px solid var(--ink);border-radius:999px;font-weight:500;font-size:15px;letter-spacing:.01em}
.btn.solid{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.signal{background:var(--rose-deep);color:var(--on-deep);border-color:var(--rose-deep);box-shadow:var(--shadow)}
.btn.block{width:100%}
.btn.ghost{border-color:var(--rule);background:var(--sheet)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn[disabled]{opacity:.4;cursor:default}
.btn:active{transform:translateY(1px)}
.link{font-weight:500;font-size:14px;text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px;text-decoration-color:var(--rose-deep)}
.row-btns{display:flex;gap:10px;flex-wrap:wrap}
.row-btns .btn{flex:1 1 140px}

/* ---------- countdown ---------- */
.board{background:var(--board);color:var(--board-ink);border-radius:22px;padding:20px 20px 18px;display:flex;flex-direction:column;gap:16px;box-shadow:var(--shadow)}
.board-top{display:flex;justify-content:space-between;gap:10px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--board-mute);font-weight:500}
.board-top .yl{color:var(--rose)}
.board-main{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.flaps{display:flex;gap:5px}
.flap{position:relative;width:50px;height:66px;background:var(--board-cell);border-radius:10px;display:grid;place-items:center;font-family:var(--f-display);font-variation-settings:"SOFT" 100,"opsz" 144;font-size:46px;font-weight:350;line-height:1;font-variant-numeric:tabular-nums lining-nums}
.flap::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:var(--board);opacity:.7}
.board-unit{font-family:var(--f-display);font-style:italic;font-size:22px;color:var(--board-ink);padding-bottom:4px;line-height:1.1}
.board-unit small{display:block;font-family:var(--f-ui);font-style:normal;color:var(--board-mute);font-size:12px;letter-spacing:.04em}
.board-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid rgba(251,240,242,.14);padding-top:14px;gap:10px}
.board-grid b{display:block;font-family:var(--f-display);font-size:24px;font-weight:400;font-variant-numeric:tabular-nums lining-nums}
.board-grid span{font-size:12px;color:var(--board-mute);line-height:1.3;display:block}

/* ---------- checklist rows ---------- */
.list{list-style:none;margin:0;padding:0}
.item{display:flex;gap:14px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--rule-2)}
.item:last-child{border-bottom:0}
.item .body{flex:1;min-width:0}
.item .t{font-weight:500}
.item .d{font-size:14px;color:var(--ink-2)}
.item.done .t{color:var(--ink-3);text-decoration:line-through;text-decoration-thickness:1px;text-decoration-color:var(--rose-deep)}
.chk{flex:none;width:26px;height:26px;border:1.25px solid var(--ink-2);border-radius:50%;display:grid;place-items:center;margin-top:-1px;transition:background .2s,border-color .2s,transform .2s}
.chk svg{width:14px;height:14px}
.chk path{fill:none;stroke:var(--on-deep);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:22;stroke-dashoffset:22;transition:stroke-dashoffset .25s ease-out .05s}
.done .chk{background:var(--rose-deep);border-color:var(--rose-deep)}
.done .chk path{stroke-dashoffset:0}
.chk:active{transform:scale(.9)}
.go{flex:none;align-self:center;font-size:13px;font-weight:500;padding:7px 12px;border-radius:999px;background:var(--paper-2);color:var(--ink)}
.agenda{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;margin-top:10px;padding:10px 12px;background:var(--paper-2);border-radius:var(--r-sm);font-size:13px;color:var(--ink-2)}
.agenda span:nth-child(odd){font-variant-numeric:tabular-nums;color:var(--rose-deep)}
.stepn{flex:none;width:28px;font-family:var(--f-display);font-style:italic;font-size:17px;color:var(--rose-deep);padding-top:0}

/* ---------- time ---------- */
.meters{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:20px;padding:18px 0 6px}
.meter .lbl{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);font-weight:500}
.meter .val{font-family:var(--f-display);font-variation-settings:"SOFT" 100;font-size:36px;font-weight:350;letter-spacing:-.01em;font-variant-numeric:tabular-nums lining-nums;line-height:1.1}
.meter .val small{font-family:var(--f-ui);font-size:14px;font-weight:400;color:var(--ink-3);letter-spacing:0}
.ruler{position:relative;height:8px;margin-top:10px;background:var(--paper-2);border-radius:999px;overflow:hidden}
.ruler i{position:absolute;left:0;top:0;bottom:0;background:var(--rose-deep);border-radius:999px;transition:width .5s ease}
.ruler.full i{background:var(--ok)}
.quick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:16px}
.qb{display:flex;flex-direction:column;gap:2px;padding:13px 16px;border:1px solid var(--rule);border-radius:var(--r);background:var(--sheet);box-shadow:var(--shadow);transition:background .35s,color .35s}
.qb .k{font-size:13px;color:var(--ink-3);letter-spacing:.02em}
.qb .m{font-family:var(--f-display);font-size:24px;font-weight:400;font-variant-numeric:tabular-nums lining-nums}
.qb.hit{background:var(--rose-deep);border-color:var(--rose-deep);color:var(--on-deep);transition:none}
.qb.hit .k{color:var(--on-deep)}
.chart{margin-top:20px}
.chart svg{display:block;width:100%;height:auto}
.chart text{fill:var(--ink-3);font-family:var(--f-ui);font-size:10px;font-variant-numeric:tabular-nums}
.chart .tv{fill:var(--ink-2);font-weight:500}
.chart .bar{fill:var(--rose)}
.chart .bar.today{fill:var(--rose-deep)}
.chart .track{fill:var(--paper-2)}
.chart .goal{stroke:var(--ink-3);stroke-width:1;stroke-dasharray:2 4}
.loglist{margin-top:12px;font-size:14px}
.logrow{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed var(--rule)}
.logrow:last-child{border-bottom:0}

/* ---------- decks ---------- */
.deck{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--rule-2);width:100%}
.deck .body{flex:1;min-width:0}
.deck .n{font-family:var(--f-display);font-variation-settings:"SOFT" 100;font-weight:400;font-size:20px;line-height:1.2}
.deck .p{font-size:13px;color:var(--ink-3)}
.counts{display:flex;gap:14px;font-size:13px;font-variant-numeric:tabular-nums;color:var(--ink-3);text-align:right}
.counts b{display:block;font-size:17px;color:var(--rose-deep);font-weight:500}
.counts .zero b{color:var(--ink-3);font-weight:400}
.duebar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 18px;margin:16px 0 8px;background:var(--sheet);border-radius:var(--r);box-shadow:var(--shadow)}
.duebar > div > div:first-child{font-family:var(--f-display);font-size:19px;font-weight:400!important}

/* ---------- flashcard ---------- */
.sess-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.prog{height:4px;background:var(--paper-2);margin-bottom:20px;border-radius:999px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--rose-deep);border-radius:999px;transition:width .3s}
.flip{perspective:1400px;width:100%;display:block;cursor:pointer;-webkit-tap-highlight-color:transparent}
.flip-in{position:relative;height:350px;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.3,.7,.2,1)}
.flip.on .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--sheet);border:1px solid var(--rule);border-radius:22px;padding:18px 22px;display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shadow)}
.face::before{content:"";position:absolute;left:22px;right:22px;top:50px;height:1px;background:var(--rose);opacity:.9}
.face.back{transform:rotateY(180deg)}
.face-top{display:flex;justify-content:space-between;align-items:center;gap:8px;height:24px;font-size:11px;color:var(--ink-3);letter-spacing:.14em;text-transform:uppercase;font-weight:500}
.de{font-family:var(--f-de);font-variation-settings:"SOFT" 100}
.word{margin:auto 0;font-family:var(--f-de);font-variation-settings:"SOFT" 100,"opsz" 144;font-size:48px;line-height:1.05;letter-spacing:-.01em;font-weight:350;overflow-wrap:anywhere}
.word.long{font-size:34px}
.word .art{font-size:.6em;font-weight:400}
.art{font-family:var(--f-de);font-style:italic;margin-right:.24em}
.art-der{color:var(--der)} .art-die{color:var(--die)} .art-das{color:var(--das)}
.hint{font-size:13px;color:var(--ink-3);font-style:italic;font-family:var(--f-display)}
.back .w2{font-family:var(--f-de);font-variation-settings:"SOFT" 100;font-size:26px;font-weight:350;margin-top:16px;line-height:1.15;overflow-wrap:anywhere}
.back .pt{font-size:19px;font-weight:500;margin-top:4px}
.kv{display:grid;grid-template-columns:76px 1fr;gap:8px 10px;margin:auto 0 0;font-size:14px;padding-top:14px;border-top:1px solid var(--rule-2)}
.kv dt{color:var(--ink-3);font-size:10.5px;text-transform:uppercase;letter-spacing:.14em;padding-top:3px}
.kv dd{margin:0;min-width:0}
.kv .exs{font-family:var(--f-de);font-size:17px;font-style:italic;line-height:1.4}
.rate{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:16px}
.rate button{border:1px solid var(--rule);background:var(--sheet);border-radius:var(--r);padding:10px 4px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:62px;justify-content:center;box-shadow:var(--shadow)}
.rate b{font-size:14px;font-weight:500}
.rate span{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.rate button:first-child b{color:var(--bad)}
.rate button:nth-child(3){background:var(--rose-deep);border-color:var(--rose-deep);color:var(--on-deep)}
.rate button:nth-child(3) span{color:var(--on-deep);opacity:.8}
.rate[hidden]{display:none!important}
.flip-cta{margin-top:16px}

/* ---------- diary ---------- */
.entry{display:grid;grid-template-columns:52px minmax(0,1fr);gap:14px;padding:16px 0;border-bottom:1px solid var(--rule-2);width:100%}
.entry .date{font-family:var(--f-display);font-size:17px;font-variant-numeric:tabular-nums lining-nums;color:var(--rose-deep);padding-top:2px;line-height:1.2}
.entry .date small{display:block;font-family:var(--f-ui);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.entry .de{font-size:20px;line-height:1.3}
.entry .pt{font-size:14px;color:var(--ink-2);margin-top:3px}
.entry .meta{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
.place{font-size:12px;padding:3px 10px;background:var(--paper-2);border-radius:20px;color:var(--ink-2)}
.missing{font-size:16px;color:var(--ink-3);font-style:italic;font-family:var(--f-display)}
.month{font-family:var(--f-display);font-style:italic;font-size:18px;color:var(--ink-2);padding-top:22px;text-transform:capitalize}

/* ---------- training ---------- */
.streak{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap;padding:6px 0 4px}
.streak .big{font-family:var(--f-display);font-variation-settings:"SOFT" 100,"opsz" 144;font-size:72px;font-weight:300;line-height:.85;letter-spacing:-.02em;color:var(--rose-deep);font-variant-numeric:tabular-nums lining-nums}
.streak .lab{padding-bottom:4px}
.streak .lab b{font-weight:500}
.days{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:5px;margin-top:16px}
.days i{aspect-ratio:1;max-width:100%;border:1px solid var(--rule);border-radius:50%;display:block}
.days i.on{background:var(--rose-deep);border-color:var(--rose-deep)}
.days i.today{box-shadow:0 0 0 2px var(--paper),0 0 0 3px var(--rose-deep)}
.daylbl{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-3);margin-top:6px}
.type{display:flex;gap:12px;align-items:center;padding:15px 0;border-bottom:1px solid var(--rule-2);width:100%}
.type .body{flex:1;min-width:0}
.type .n{font-family:var(--f-display);font-variation-settings:"SOFT" 100;font-size:19px;font-weight:400}
.type .p{font-size:13px;color:var(--ink-3)}
.type .pc{font-family:var(--f-display);font-variant-numeric:tabular-nums lining-nums;font-weight:400;font-size:20px;text-align:right;color:var(--rose-deep)}
.type .pc small{display:block;font-family:var(--f-ui);font-weight:400;font-size:11px;color:var(--ink-3)}
.q-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.timer{font-family:var(--f-display);font-size:26px;font-weight:400;font-variant-numeric:tabular-nums lining-nums}
.timer.low{color:var(--bad)}
.q-type{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:500}
.q-prompt{font-size:19px;font-weight:500;line-height:1.35;margin:8px 0 20px;text-wrap:balance}
.q-prompt .de{font-weight:350;font-size:28px;line-height:1.3}
.blank{display:inline-block;min-width:2.6em;border-bottom:1.5px solid var(--rose-deep);text-align:center}
.choices{display:flex;flex-direction:column;gap:10px}
.choice{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border:1px solid var(--rule);border-radius:var(--r);width:100%;background:var(--sheet);font-size:16px;box-shadow:var(--shadow);transition:background .2s,border-color .2s}
.choice .l{flex:none;font-family:var(--f-display);font-style:italic;width:18px;color:var(--rose-deep)}

.choice.wrong{border-color:var(--bad);box-shadow:inset 0 0 0 1px var(--bad)}
.choice.picked{background:var(--ink);color:var(--paper);border-color:var(--ink)}

.tiles.target{border-bottom:1px solid var(--rose-deep);padding-bottom:12px;margin-bottom:16px;min-height:62px;align-content:flex-start}

.phase{position:relative;padding:0 0 30px 38px}
.phase::before{content:"";position:absolute;left:12px;top:30px;bottom:4px;width:1px;background:var(--rule)}
.phase:last-child::before{display:none}
.node{position:absolute;left:0;top:2px;width:25px;height:25px;border:1px solid var(--ink-2);border-radius:50%;background:var(--paper);display:grid;place-items:center;font-family:var(--f-display);font-style:italic;font-size:13px}
.phase.cur .node{background:var(--rose-deep);border-color:var(--rose-deep);color:var(--on-deep)}
.phase.past .node{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.phase .ph{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.phase .pn{font-family:var(--f-display);font-variation-settings:"SOFT" 100;font-size:26px;font-weight:350;letter-spacing:-.01em}
.phase .pm{font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.phase .pf{font-size:14px;color:var(--ink-2);margin-top:2px}

.phase.cur::before{display:none}
.phase.cur .node{left:18px;top:22px}
.phase .list{margin-top:6px}
.phase:not(.cur) .item{padding:9px 0}
.pbar{display:flex;gap:4px;margin-top:10px}
.pbar i{flex:1;height:4px;border-radius:999px;background:var(--paper-2)}
.pbar i.on{background:var(--rose-deep)}

.field label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:500}
.input{width:100%;min-height:48px;padding:11px 14px;border:1px solid var(--rule);border-radius:var(--r-sm);background:var(--sheet);font-size:16px}
.input:focus{outline:none;border-color:var(--rose-deep);box-shadow:0 0 0 3px var(--paper-2)}
textarea.input{min-height:80px;resize:vertical}
textarea.de,.input.de{font-family:var(--f-de);font-size:19px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{padding:7px 13px;border:1px solid var(--rule);border-radius:20px;font-size:14px;background:var(--sheet)}
.chips button[aria-pressed="true"]{border-color:var(--rose-deep);background:var(--rose-deep);color:var(--on-deep)}
.setgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding-top:14px}
.note{font-size:13px;color:var(--ink-3);margin-top:12px;line-height:1.5}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px;font-size:14px}

/* ---------- carteira ---------- */
.split{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.split > div{padding:14px 16px;background:var(--sheet);border-radius:var(--r);box-shadow:var(--shadow)}
.split b{display:block;font-family:var(--f-display);font-size:20px;font-weight:400}
.split span{font-size:14px;color:var(--ink-2)}
.vocab{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:0 12px;font-size:15px}
.vocab > div{padding:9px 0;border-bottom:1px solid var(--rule-2);min-width:0}
.vocab .de{font-size:18px}

/* ---------- tab bar ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:0 12px calc(10px + env(safe-area-inset-bottom,0px));pointer-events:none}
.tabbar ul{pointer-events:auto;list-style:none;margin:0 auto;padding:6px;max-width:520px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:var(--sheet);border:1px solid var(--rule);border-radius:26px;box-shadow:0 12px 32px -12px rgba(80,40,60,.35)}
.tabbar button{width:100%;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px 6px;font-size:11px;font-weight:500;color:var(--ink-3);position:relative;text-align:center;border-radius:20px;transition:background .2s,color .2s}
.tabbar svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.tabbar button[aria-current="page"]{color:var(--rose-deep);background:var(--paper-2)}

/* ---------- sheet + toast ---------- */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(40,20,32,.4);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:92%;overflow:auto;background:var(--paper);border-radius:26px 26px 0 0;padding:22px var(--gut) calc(20px + env(safe-area-inset-bottom,0px));animation:up .25s ease-out}
.sheet h3{margin:0 0 4px;font-family:var(--f-display);font-variation-settings:"SOFT" 100;font-weight:350;font-size:28px;letter-spacing:-.01em}
.sheet .sub{font-size:14px;color:var(--ink-3);margin-bottom:18px}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--paper);padding:11px 18px;border-radius:999px;font-size:14px;display:flex;gap:14px;align-items:center;max-width:calc(100% - 32px);white-space:nowrap;box-shadow:var(--shadow)}
.toast button{color:var(--rose);font-weight:600}

@media (min-width:700px){
  h1{font-size:48px}
  .flip-in{height:370px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{transition:none!important;animation:none!important}
}

function deckStats(deckId) {
  const t = today(); const cs = S.cards.filter(c => deckId === "all" || c.deck === deckId);
  return {total:cs.length, newC:cs.filter(c => c.due === null).length, due:cs.filter(c => c.due !== null && c.due <= t).length};
}
const NEW_PER_SESSION = 10;
function buildQueue(deckId) {
  const t = today(); const cs = S.cards.filter(c => (deckId === "all" || c.deck === deckId));
  const due = shuffle(cs.filter(c => c.due !== null && c.due <= t));
  const fresh = cs.filter(c => c.due === null).slice(0, NEW_PER_SESSION);
  return [...due, ...fresh].map(c => c.id);
}
function todayQueueSize() { return deckStats("all").due + Math.min(NEW_PER_SESSION, deckStats("all").newC); }

/* repetição espaçada (SM-2 simplificado). r: 0 errei, 1 difícil, 2 bom, 3 fácil */
function schedule(c, r) {
  const t = today();
  if (r === 0) { c.lapses++; c.ease = Math.max(1.3, c.ease - 0.2); c.ivl = 0; c.reps = 0; c.due = t; return 0; }
  let ivl;
  if (c.reps === 0) ivl = r === 3 ? 4 : 1;
  else if (c.reps === 1) ivl = r === 1 ? 2 : r === 2 ? 3 : 6;
  else ivl = r === 1 ? Math.max(c.ivl + 1, Math.round(c.ivl * 1.2)) : r === 2 ? Math.max(c.ivl + 1, Math.round(c.ivl * c.ease)) : Math.max(c.ivl + 2, Math.round(c.ivl * c.ease * 1.3));
  if (r === 1) c.ease = Math.max(1.3, c.ease - 0.15);
  if (r === 3) c.ease += 0.15;
  c.ivl = ivl; c.reps++; c.due = addDays(t, ivl); return ivl;
}

function weekChart() {
  const ds = weekDays(), t = today();
  const vals = ds.map(minutesOn);
  const daily = Math.round(S.goalMin / 7);
  const max = Math.max(daily * 1.5, ...vals);
  const top = Math.ceil(max / 30) * 30;
  const W = 320, H = 172, padL = 4, padR = 4, base = 120, topY = 18;
  const bw = (W - padL - padR) / 7;
  const y = v => base - (v / top) * (base - topY);
  const hasSample = S.logs.some(l => l.sample && ds.includes(l.d));
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Minutos por dia nesta semana">`;
  ds.forEach((d,i) => {
    const x = padL + i*bw + bw*0.18, w = bw*0.64, v = vals[i];
    s += `<rect class="track" x="${x}" y="${topY}" width="${w}" height="${base-topY}"/>`;
    if (v > 0) s += `<rect class="bar ${d === t ? "today" : ""}" x="${x}" y="${y(v)}" width="${w}" height="${base - y(v)}"/>`;
    if (v > 0) s += `<text class="tv" x="${x + w/2}" y="${y(v) - 4}" text-anchor="middle">${v}</text>`;
    s += `<text x="${x + w/2}" y="${base + 16}" text-anchor="middle" ${d === t ? 'class="tv"' : ""}>${WD3[parseKey(d).getDay()]}</text>`;
  });
  s += `<line class="goal" x1="0" x2="${W}" y1="${y(daily)}" y2="${y(daily)}"/>`;
  s += `<text x="${W - 2}" y="${H - 4}" text-anchor="end">linha tracejada: ${daily} min/dia</text>`;
  s += `<text x="2" y="${H - 4}">min por dia</text></svg>`;
  return `<div class="chart">${s}${hasSample ? `<p class="note">Os dias anteriores desta semana trazem registros de exemplo. Remova em Plano → Dados.</p>` : ""}</div>`;
}

function ebStat(id) { return S.einb[id] || {r:0,w:0}; }
const mastered = () => EINB.filter(q => { const s = ebStat(q.id); return s.r >= 2 && s.r > s.w * 2; }).length;
const toReview = () => EINB.filter(q => { const s = ebStat(q.id); return s.w > 0 && s.w * 2 >= s.r; }).length;
const passMark = n => Math.ceil(n * 17 / 33);
function vEbHome() {

  <section class="sec">

    <button class="type" data-act="ebTrain"><span class="body"><span class="n" style="display:block">Treino</span><span class="p">Uma pergunta por vez, com correção na hora. As que você erra voltam mais vezes.</span></span><span class="pc">→</span></button>
    <button class="type" data-act="simStart"><span class="body"><span class="n" style="display:block">Simulado</span><span class="p">Formato da prova: 33 perguntas, 60 minutos, resultado só no fim.</span></span><span class="pc">→</span></button>
    <p class="note">As ${EINB.length} perguntas são exemplos no formato do catálogo oficial do BAMF (300 gerais + 10 do seu estado). Com o banco de exemplo, o simulado usa ${n} perguntas e a nota de corte proporcional: ${passMark(n)} acertos.</p>
  </section>
  ${S.sims.length ? `<section class="sec"><div class="sec-h"><h2>Simulados</h2><span class="aside">acertos</span></div>
    ${S.sims.slice(-5).reverse().map(s => `<div class="logrow"><span class="num">${fmtDate(s.d)}</span><span class="num"><b>${s.score}/${s.n}</b> · <span class="${s.score >= passMark(s.n) ? "pass" : "fail"}">${s.score >= passMark(s.n) ? "aprovada" : "não passou"}</span></span></div>`).join("")}</section>` : ""}`;
}
function pickEb(exclude) {
  const ws = EINB.map(q => { const s = ebStat(q.id); return Math.max(0.3, 1 + s.w * 2 - s.r * 0.5) * (q.id === exclude ? 0 : 1); });
  let r = Math.random() * ws.reduce((a,b) => a + b, 0);
  for (let i = 0; i < EINB.length; i++) { r -= ws[i]; if (r <= 0) return EINB[i]; }
  return EINB[0];
}
function vEbTrain() {

  return `${head("Fahrplan bis Mai 2027", "Plano e marcos")}
  <div>${PHASES.map((p,i) => { const n = p.ms.filter(([id]) => S.milestones[id]).length;
    const cls = i === ci ? "cur" : i < ci ? "past" : "";
    return `<section class="phase ${cls}">
      <span class="node">${i+1}</span>
      <div class="ph"><span class="pn">${p.name} ${i === ci ? '<span class="tag now">agora</span>' : ""}</span><span class="pm">${p.months}</span></div>
      <div class="pf">${esc(p.grammar)} · ${esc(p.skill)}</div>
      <div class="pbar" data-count="${p.id}">${p.ms.map(([id]) => `<i class="${S.milestones[id] ? "on" : ""}"></i>`).join("")}</div>
      <ul class="list">${p.ms.map(([id,t]) => `<li class="item ${S.milestones[id] ? "done" : ""}">
        <button class="chk" data-act="msCheck" data-v="${id}" data-p="${p.id}" aria-pressed="${!!S.milestones[id]}" aria-label="Marcar ${esc(t)}">${checkSvg}</button>
        <div class="body"><div class="t" style="font-weight:${i === ci ? 600 : 500}">${esc(t)}</div></div></li>`).join("")}</ul>
    </section>`; }).join("")}</div>

  <section class="sec">
    <div class="sec-h"><h2>Dados</h2><span class="aside">${storageOk ? "salvo neste navegador" : "não está salvando"}</span></div>
    <div class="setgrid">
      <div class="field"><label for="examDate">Data da prova B1</label><input class="input num" id="examDate" type="date" value="${S.examDate}" data-set="examDate"></div>
      <div class="field"><label for="goalH">Meta semanal (h)</label><input class="input num" id="goalH" type="number" min="1" max="40" step="0.5" value="${S.goalMin/60}" data-set="goal"></div>
    </div>
    <div class="row-btns">
      <button class="btn ghost" data-act="ask" data-v="samples">Remover exemplos</button>
      <button class="btn ghost" data-act="ask" data-v="reset">Apagar tudo</button>
    </div>
    ${c === "samples" ? `<div class="confirm">Remove cartões, tempos e frases de exemplo. Exercícios e perguntas continuam. <button class="btn danger" data-act="removeSamples">Remover</button><button class="btn ghost" data-act="cancelConfirm">Cancelar</button></div>` : ""}
    ${c === "reset" ? `<div class="confirm">Apaga todo o progresso e volta aos dados de exemplo. <button class="btn danger" data-act="resetAll">Apagar</button><button class="btn ghost" data-act="cancelConfirm">Cancelar</button></div>` : ""}
    <p class="note">O progresso fica só neste navegador e neste aparelho. Limpar os dados do site apaga tudo.</p>
  </section>`;
}

/* ---------------- sheets ---------------- */
let sheetState = null;
function openEntrySheet(entry, missed) {
  sheetState = {id: entry ? entry.id : null, place: entry ? entry.place : PLACES[0], missed};
  const e = entry || {pt:"", de:""};
  $("#sheet").innerHTML = `<div class="scrim" data-act="sheetScrim"><form class="sheet" id="entryForm" role="dialog" aria-modal="true" aria-labelledby="sheetT">
    <h3 id="sheetT">${entry ? "Editar frase" : missed ? "O que faltou hoje?" : "Frase aprendida"}</h3>
    <div class="sub">${missed ? "Anote agora, mesmo sem saber em alemão. Depois você completa." : "Fica no diário com data e lugar."}</div>
    <div class="field"><label for="fPt">O que você queria dizer (português)</label><textarea class="input" id="fPt" required>${esc(e.pt)}</textarea></div>
    <div class="field"><label for="fDe">Em alemão ${missed ? "(se já souber)" : ""}</label><textarea class="input de" id="fDe" lang="de" placeholder="Kann ich …">${esc(e.de)}</textarea></div>
    <div class="field"><label>Onde</label><div class="chips" id="fPlace">${PLACES.map(p => `<button type="button" data-act="place" data-v="${esc(p)}" aria-pressed="${p === sheetState.place}">${p}</button>`).join("")}</div></div>
    ${entry && entry.cardId ? "" : `<label style="display:flex;gap:10px;align-items:center;margin:4px 0 16px;font-size:15px"><input type="checkbox" id="fCard" checked style="width:20px;height:20px;accent-color:var(--ink)"> Criar flashcard quando tiver a frase em alemão</label>`}
    <div class="row-btns"><button type="submit" class="btn solid">Salvar</button><button type="button" class="btn ghost" data-act="sheetClose">Cancelar</button></div>
    ${entry ? `<div class="confirm" style="margin-top:14px">${UI.confirm === "del" ? `Apagar esta frase? <button type="button" class="btn danger" data-act="diaryDel">Apagar</button>` : `<button type="button" class="link" data-act="askDel">Apagar frase</button>`}</div>` : ""}
  </form></div>`;
  setTimeout(() => { const f = $(entry ? "#fDe" : "#fPt"); f && f.focus(); }, 60);
}
function openLogSheet() {
  sheetState = {log:true};
  $("#sheet").innerHTML = `<div class="scrim" data-act="sheetScrim"><form class="sheet" id="logForm" role="dialog" aria-modal="true" aria-labelledby="sheetL">
    <h3 id="sheetL">Registrar tempo</h3><div class="sub">Qualquer contato com alemão conta.</div>
    <div class="setgrid">
      <div class="field"><label for="lMin">Minutos</label><input class="input num" id="lMin" type="number" min="1" max="600" value="20" required></div>
      <div class="field"><label for="lKind">Atividade</label><select class="input" id="lKind">${Object.entries(KINDS).map(([k,v]) => `<option value="${k}">${v}</option>`).join("")}</select></div>
    </div>
    <div class="row-btns"><button type="submit" class="btn solid">Registrar</button><button type="button" class="btn ghost" data-act="sheetClose">Cancelar</button></div>
  </form></div>`;
}
function closeSheet() { $("#sheet").innerHTML = ""; sheetState = null; if (UI.confirm === "del") UI.confirm = null; }
function makeCardFromEntry(e) {
  const c = {id:uid(), deck:"saetze", art:"", word:e.de, pl:"", pt:e.pt, ex:"", due:null, ivl:0, ease:2.5, reps:0, lapses:0};
  S.cards.push(c); e.cardId = c.id;
}

/* ---------------- toast ---------------- */
let toastT;
function toast(msg, undo) {
  clearTimeout(toastT);
  $("#toast").innerHTML = `<div class="toast" role="status"><span>${msg}</span>${undo ? `<button data-act="undo">Desfazer</button>` : ""}</div>`;
  toastT = setTimeout(() => { $("#toast").innerHTML = ""; }, 4000);
}

/* ---------------- timers ---------------- */
let tick = null;
function stopTick() { if (tick) { clearInterval(tick); tick = null; } }
function startTickIfNeeded() {
  if (!(UI.ex && !UI.ex.over && S.tab === "treino") && !(UI.sim && !UI.sim.done && S.tab === "treino")) return;
  const upd = () => {
    if (UI.ex && !UI.ex.over) {
      const left = Math.max(0, UI.ex.end - Date.now());
      const el = document.querySelector('[data-timer="ex"]');
      if (el) { el.textContent = `${Math.floor(left/60000)}:${pad(Math.floor(left/1000) % 60)}`; el.classList.toggle("low", left < 30000); }
      if (left <= 0) { finishEx(); render(); }
    } else if (UI.sim && !UI.sim.done) {
      const left = Math.max(0, UI.sim.end - Date.now());
      const el = document.querySelector('[data-timer="sim"]');
      if (el) { el.textContent = `${Math.floor(left/60000)}:${pad(Math.floor(left/1000) % 60)}`; el.classList.toggle("low", left < 5*60000); }
      if (left <= 0) { finishSim(); render(); }
    }
  };
  upd(); tick = setInterval(upd, 1000);
}

/* ---------------- ações ---------------- */
function goTop() { window.scrollTo({top:0}); }
function refreshPhaseBar(pid) {
  const p = PHASES.find(x => x.id === pid); const el = document.querySelector(`[data-count="${pid}"]`);
  if (p && el) el.innerHTML = p.ms.map(([id]) => `<i class="${S.milestones[id] ? "on" : ""}"></i>`).join("");
}
function toggleRow(btn, store, id) {
  store[id] = !store[id]; if (!store[id]) delete store[id];
  const li = btn.closest(".item"); li.classList.toggle("done", !!store[id]);
  btn.setAttribute("aria-pressed", String(!!store[id]));
  save();
}
const A = {
  tab(el) { const v = el.dataset.v; if (S.tab === v && (UI.sess || UI.ex || UI.eb || UI.sim)) { /* manter sessão */ }
    S.tab = v; UI.confirm = null; save(); render(); goTop(); },
  go(el) {
    const v = el.dataset.v;
    if (v === "cards") { S.tab = "cartoes"; UI.cardsView = "decks"; }
    if (v === "diary") { S.tab = "cartoes"; UI.cardsView = "diary"; UI.sess = null; }
    if (v === "ex") { S.tab = "treino"; UI.trView = "ex"; }
    if (v === "einb") { S.tab = "treino"; UI.trView = "einb"; }
    save(); render(); goTop();
  },
  dayCheck(el) { const t = today(); S.daily[t] = S.daily[t] || {}; toggleRow(el, S.daily[t], el.dataset.v); },
  msCheck(el) { toggleRow(el, S.milestones, el.dataset.v); refreshPhaseBar(el.dataset.p); },
  fsCheck(el) { toggleRow(el, S.fs, el.dataset.v); const c = document.querySelector('[data-count="fs"]'); if (c) c.textContent = `${FS_STEPS.filter(([id]) => S.fs[id]).length} de ${FS_STEPS.length}`; },
  log(el) {
    const k = el.dataset.k, m = +el.dataset.m; const entry = {id:uid(), d:today(), min:m, kind:k};
    S.logs.push(entry); UI.lastLog = entry.id; save();
    el.classList.add("hit"); setTimeout(() => { render(); toast(`+${fmtMin(m)} · ${KINDS[k]}`, true); }, 260);
  },
  logOther() { openLogSheet(); },
  undo() { if (!UI.lastLog) return; S.logs = S.logs.filter(l => l.id !== UI.lastLog); UI.lastLog = null; save(); $("#toast").innerHTML = ""; render(); },
  delLog(el) { S.logs = S.logs.filter(l => l.id !== el.dataset.v); save(); render(); },
  cardsView(el) { UI.cardsView = el.dataset.v; render(); },
  study(el) {
    const deck = el.dataset.v; const q = buildQueue(deck);
    if (!q.length) { toast("Nada para revisar neste baralho hoje."); return; }
    S.tab = "cartoes"; UI.sess = {deck, queue:q, i:0, flipped:false, seen:0, wrong:0, start:Date.now()};
    render(); goTop();
  },
  flip() {
    const s = UI.sess; if (!s) return; s.flipped = !s.flipped;
    $("#flip").classList.toggle("on", s.flipped);
    $("#rate").hidden = !s.flipped; $("#flipcta").hidden = s.flipped;
  },
  rate(el) {
    const s = UI.sess; const r = +el.dataset.v; const c = S.cards.find(x => x.id === s.queue[s.i]);
    schedule(c, r); s.seen++;
    if (r === 0) { s.wrong++; s.queue.push(c.id); }
    s.i++; s.flipped = false; save(); render();
  },
  endSess() { UI.sess = null; render(); goTop(); },
  logCardsSess() {
    const s = UI.sess; const m = Math.max(1, Math.round((Date.now() - s.start)/60000));
    S.logs.push({id:uid(), d:today(), min:m, kind:"cards"}); save(); UI.sess = null; render(); toast(`+${fmtMin(m)} · Flashcards`);
  },
  missed() { UI.confirm = null; openEntrySheet(null, true); },
  diaryNew() { UI.confirm = null; openEntrySheet(null, false); },
  diaryEdit(el) { UI.confirm = null; const e = S.diary.find(x => x.id === el.dataset.v); if (e) openEntrySheet(e, false); },
  place(el) { sheetState.place = el.dataset.v; document.querySelectorAll("#fPlace button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.v === sheetState.place))); },
  sheetClose() { closeSheet(); },
  sheetScrim(el, ev) { if (ev.target === el) closeSheet(); },
  askDel() { UI.confirm = "del"; const e = S.diary.find(x => x.id === sheetState.id); const pt = $("#fPt").value, de = $("#fDe").value; const place = sheetState.place; openEntrySheet({...e, pt, de, place}, false); },
  diaryDel() {
    const e = S.diary.find(x => x.id === sheetState.id);
    if (e && e.cardId) S.cards = S.cards.filter(c => c.id !== e.cardId);
    S.diary = S.diary.filter(x => x.id !== sheetState.id); UI.confirm = null; save(); closeSheet(); render(); toast("Frase apagada.");
  },
  trView(el) { UI.trView = el.dataset.v; render(); },
  exStart(el) { UI.eb = null; UI.sim = null; startEx(el.dataset.v); S.tab = "treino"; render(); goTop(); },
  exPick(el) {
    const x = UI.ex, e = x.items[x.i]; if (x.ans !== null) return;
    x.ans = e.type === "artikel" ? el.dataset.v : +el.dataset.v;
    const ok = e.type === "artikel" ? x.ans === e.ans : x.ans === e.ans;
    recordEx(e, ok); render();
  },
  exTile(el) { UI.ex.picked.push(+el.dataset.v); render(); },
  exUntile(el) { UI.ex.picked.splice(+el.dataset.v, 1); render(); },
  exCheck() {
    const x = UI.ex, e = x.items[x.i];
    const ok = x.picked.map(i => e.tiles[i]).join(" ") === e.tiles.join(" ");
    x.ans = ok; recordEx(e, ok); render();
  },
  exNext() {
    const x = UI.ex; x.i++; x.ans = null;
    if (x.i >= x.items.length) { finishEx(); } else prepOrder();
    render(); goTop();
  },
  exEnd() { finishEx(); render(); },
  exClose() { UI.ex = null; render(); },
  ebTrain() { UI.ex = null; UI.sim = null; UI.eb = {q:pickEb(), ans:null, count:0, right:0, start:Date.now()}; render(); goTop(); },
  ebPick(el) {
    const b = UI.eb; if (b.ans !== null) return; b.ans = +el.dataset.v; b.count++;
    const s = S.einb[b.q.id] || {r:0,w:0}; if (b.ans === b.q.ans) { s.r++; b.right++; } else s.w++;
    S.einb[b.q.id] = s; save(); render();
  },
  ebNext() { const b = UI.eb; b.q = pickEb(b.q.id); b.ans = null; render(); goTop(); },
  ebEnd() {
    const b = UI.eb; if (b.count) { const m = Math.max(1, Math.round((Date.now() - b.start)/60000)); S.logs.push({id:uid(), d:today(), min:m, kind:"outro"}); save(); toast(`${b.right} de ${b.count} certas · +${fmtMin(m)}`); }
    UI.eb = null; render();
  },
  simStart() {
    UI.ex = null; UI.eb = null; UI.confirm = null;
    const list = shuffle(EINB).slice(0, 33);
    UI.sim = {list, i:0, answers:new Array(list.length).fill(null), start:Date.now(), end:Date.now() + 60*60000, done:false};
    render(); goTop();
  },
  simPick(el) { const m = UI.sim; m.answers[m.i] = +el.dataset.v; if (m.i + 1 < m.list.length) setTimeout(() => { m.i++; render(); }, 180); render(); },
  simMove(el) { const m = UI.sim; m.i = Math.min(m.list.length - 1, Math.max(0, m.i + +el.dataset.v)); render(); },
  simAsk() { UI.confirm = "sim"; render(); goTop(); },
  simFinish() { finishSim(); render(); goTop(); },
  simClose() { UI.sim = null; render(); },
  ask(el) { UI.confirm = el.dataset.v; render(); },
  cancelConfirm() { UI.confirm = null; render(); },
  removeSamples() {
    const ids = new Set(S.cards.filter(c => c.sample).map(c => c.id));
    S.cards = S.cards.filter(c => !c.sample);
    S.logs = S.logs.filter(l => !l.sample);
    S.diary = S.diary.filter(e => !e.sample);
    S.diary.forEach(e => { if (ids.has(e.cardId)) delete e.cardId; });
    UI.confirm = null; save(); render(); toast("Exemplos removidos.");
  },
  resetAll() { try { localStorage.removeItem(KEY); } catch (e) {} S = seed(); UI.confirm = null; UI.sess = UI.ex = UI.eb = UI.sim = null; save(); render(); toast("Tudo apagado."); },
};
function recordEx(e, ok) {
  const s = S.exStats[e.type] || {r:0,w:0}; ok ? s.r++ : s.w++; S.exStats[e.type] = s;
  if (ok) UI.ex.right++;
  save();
}

document.addEventListener("click", ev => {
  const el = ev.target.closest("[data-act]"); if (!el) return;
  if (el.disabled) return;
  const fn = A[el.dataset.act]; if (!fn) return;
  if (el.dataset.act === "sheetScrim") { fn(el, ev); return; }
  ev.preventDefault(); fn(el, ev);
});
document.addEventListener("submit", ev => {
  ev.preventDefault();
  if (ev.target.id === "logForm") {
    const m = Math.round(+$("#lMin").value), k = $("#lKind").value;
    if (!(m > 0)) return;
    const entry = {id:uid(), d:today(), min:Math.min(600, m), kind:k}; S.logs.push(entry); UI.lastLog = entry.id;
    save(); closeSheet(); render(); toast(`+${fmtMin(entry.min)} · ${KINDS[k]}`, true);
    return;
  }
  if (ev.target.id === "entryForm") {
    const pt = $("#fPt").value.trim(), de = $("#fDe").value.trim();
    if (!pt && !de) { $("#fPt").focus(); return; }
    const wantCard = $("#fCard") ? $("#fCard").checked : false;
    let e = sheetState.id ? S.diary.find(x => x.id === sheetState.id) : null;
    if (e) { e.pt = pt; e.de = de; e.place = sheetState.place; e.sample = false;
      if (e.cardId) { const c = S.cards.find(x => x.id === e.cardId); if (c) { c.word = de || c.word; c.pt = pt; } } }
    else { e = {id:uid(), date:today(), place:sheetState.place, de, pt}; S.diary.push(e); }
    let msg = "Frase anotada no diário.";
    if (de && wantCard && !e.cardId) { makeCardFromEntry(e); msg = "Frase anotada e cartão criado."; }
    else if (!de) msg = "Anotada. Complete o alemão quando souber.";
    UI.confirm = null; save(); closeSheet(); render(); toast(msg);
  }
});
document.addEventListener("change", ev => {
  const t = ev.target;
  if (t.dataset.set === "examDate" && /^\d{4}-\d{2}-\d{2}$/.test(t.value)) { S.examDate = t.value; save(); toast(`Prova em ${fmtDate(t.value)}.`); }
  if (t.dataset.set === "goal") { const h = parseFloat(t.value); if (h > 0 && h <= 40) { S.goalMin = Math.round(h * 60); save(); toast(`Meta: ${fmtMin(S.goalMin)} por semana.`); } }
});
document.addEventListener("keydown", ev => {
  if (ev.key === "Escape" && sheetState) closeSheet();
  if (UI.sess && S.tab === "cartoes" && !sheetState && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) {
    if ((ev.key === " " || ev.key === "Enter") && !UI.sess.flipped && (document.activeElement.id === "flip" || document.activeElement === document.body)) { ev.preventDefault(); A.flip(); }
    else if (UI.sess.flipped && ["1","2","3","4"].includes(ev.key)) { A.rate({dataset:{v:String(+ev.key - 1)}}); }
  }
});
// virada de dia com o app aberto
let lastDay = today();
document.addEventListener("visibilitychange", () => { if (!document.hidden && today() !== lastDay) { lastDay = today(); render(); } });

render();

// app instalável e offline (só quando servido por https, ex.: GitHub Pages)
if ("serviceWorker" in navigator && location.protocol === "https:") {
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
}
</script>
</body>
</html>
